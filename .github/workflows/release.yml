name: Test and release cross-platform catalog

on:
  push:
    branches: [main]
    paths:
      - 'review/**'
      - 'tools/**'
      - 'tests/**'
      - 'skills/**'
      - 'comfyui/**'
      - 'open_*'
      - 'START_HERE*'
      - 'VERSION*'
      - 'README*'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish VERSION after all OS tests pass
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: catalog-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read package version
        id: version
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from package_release import checked_version
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"version={checked_version(Path.cwd())}\n")
          PY
      - name: Build verified complete ZIP
        run: python tools/package_release.py --dest dist --cache "$RUNNER_TEMP/catalog-base"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-release-candidate
          path: dist/*
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CATALOG_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: old-python
        with:
          python-version: '3.9'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-release-candidate
          path: dist
      - name: Install test image support
        run: |
          python -m pip install -r tools/requirements-editor.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify native locks and folder routing
        run: python -B -m unittest discover -s tests -v
      - name: Test the complete ZIP on this OS
        run: python -B tests/check_archive_runtime.py --archive dist/Krea2-Character-Catalog-v${{ needs.build.outputs.version }}.zip --report reports/${{ matrix.os }}.json --test-venv --old-python "${{ steps.old-python.outputs.python-path }}" --browser-test
      - name: Test comparison and metadata contracts from the distributed ZIP
        run: python -B tests/check_audit_contracts.py --archive dist/Krea2-Character-Catalog-v${{ needs.build.outputs.version }}.zip --report reports/audit-${{ matrix.os }}.json --browser-test
      - name: Test comparison setup launcher and folder selection from the distributed ZIP
        run: python -B tests/check_setup_gui.py --archive dist/Krea2-Character-Catalog-v${{ needs.build.outputs.version }}.zip --report reports/setup-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [build, test]
    env:
      CATALOG_VERSION: ${{ needs.build.outputs.version }}
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: catalog-release-candidate
          path: dist
      - name: Publish this exact tested ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$CATALOG_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$CATALOG_VERSION already exists. Refusing to replace an existing release." >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cp "docs/RELEASE_v$CATALOG_VERSION.md" release-notes.md
          printf '\n### Release validation\n\n[Exact tested ZIP: all three OS jobs and reports](https://github.com/%s/actions/runs/%s).\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "v$CATALOG_VERSION" "dist/Krea2-Character-Catalog-v$CATALOG_VERSION.zip" "dist/Krea2-Character-Catalog-Rejected-Workflows-v$CATALOG_VERSION.zip" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Krea2 Character Catalog v$CATALOG_VERSION — Windows, macOS, Linux" --notes-file release-notes.md --latest

  deploy-demo:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-release-candidate
          path: dist
      - name: Build the read-only demo from the tested ZIP
        run: |
          python -m pip install -r tools/requirements-editor.txt
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'tools'); from package_release import safe_extract; safe_extract('dist/Krea2-Character-Catalog-v${{ needs.build.outputs.version }}.zip',Path('demo-release'))"
          python tools/build_static_demo.py --root demo-release/Krea2-Character-Catalog --dest "$RUNNER_TEMP/catalog-site" --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${{ needs.build.outputs.version }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/catalog-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
