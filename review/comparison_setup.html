<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimaDex comparison — Setup</title><link rel="stylesheet" href="comparison_setup.css"><script src="comparison_setup.js" defer></script></head><body><main><header><button id="close-screen" type="button" data-en="Close screen" data-ja="画面を閉じる"></button><select id="language" aria-label="Language"><option value="en">English</option><option value="ja">日本語</option></select><h1 data-en="AnimaDex comparison — Setup" data-ja="AnimaDex 比較 — 初期設定"></h1><p data-en="Choose the folders below. No commands, JSON editing, or AI assistant required." data-ja="フォルダーを選択するだけで設定できます。コマンド・JSON編集・AIアシスタントは不要です。"></p></header><form id="setup">
<fieldset><legend data-en="1. Krea2 Character Catalog" data-ja="① Krea2 Character Catalog"></legend><div class="folder"><input id="catalog_root" aria-label="Krea2 catalog folder" readonly><button type="button" data-pick="catalog_root" data-en="Choose folder…" data-ja="選択…"></button></div><p id="catalog-status" role="status"></p><button type="button" id="start-catalog" data-en="Start catalog" data-ja="カタログを起動"></button></fieldset>
<fieldset><legend data-en="2. AnimaDex" data-ja="② AnimaDex"></legend><div class="folder"><input id="animadex_root" aria-label="AnimaDex folder" readonly><button type="button" data-pick="animadex_root" data-en="Choose folder…" data-ja="選択…"></button></div><p id="anima-status" role="status"></p><small data-en="Select the local AnimaDex installation, containing its database and reference images." data-ja="データベースと参照画像がある、ローカルのAnimaDexフォルダーを選択してください。"></small></fieldset>
<fieldset><legend data-en="3. Comparison scope" data-ja="③ 比較する範囲"></legend><label><input type="radio" name="scope" value="all" checked><span data-en="All characters" data-ja="すべてのキャラクター"></span></label><label><input type="radio" name="scope" value="work"><span data-en="Choose a work" data-ja="作品を選ぶ"></span></label><input id="copyright" list="works" type="search" aria-label="Copyright" disabled><datalist id="works"></datalist></fieldset>
<details><summary data-en="Advanced settings (only if detection fails)" data-ja="詳細設定（自動検出できない場合）"></summary><label data-en="AnimaDex database" data-ja="AnimaDexのDBファイル"></label><div class="folder"><input id="animadex_db" readonly aria-label="Database"><button type="button" data-pick="animadex_db" data-en="Choose file…" data-ja="選択…"></button></div><label data-en="Reference image folder" data-ja="参照画像フォルダー"></label><div class="folder"><input id="thumbs_root" readonly aria-label="Reference images"><button type="button" data-pick="thumbs_root" data-en="Choose folder…" data-ja="選択…"></button></div><label data-en="Comparison save folder" data-ja="比較の保存先"></label><div class="folder"><input id="output" readonly aria-label="Comparison save folder"><button type="button" data-pick="output" data-en="Choose parent folder…" data-ja="保存先の親フォルダーを選択…"></button></div><small data-en="A new review folder is created here; previous comparisons are preserved." data-ja="新しい比較フォルダーを作成します。以前の比較は保持します。"></small></details>
<div class="actions"><button type="button" id="check" data-en="Check connection" data-ja="接続を確認"></button><button id="save" type="submit" disabled data-en="Save settings and open comparison" data-ja="設定を保存して比較を開く"></button></div><p id="status" role="status" aria-live="polite"></p><div id="result" hidden></div><p><small data-en="Setup does not change verdicts or delete images. Missing references are reported separately." data-ja="設定だけでは合否を変更せず、画像も削除しません。参照がない項目は別に報告します。"></small></p></form><p data-en="Close keeps your current inputs on this screen. Cancel restores your last saved settings. Neither changes verdicts." data-ja="閉じると入力をこの画面に残します。キャンセルは最後に保存した設定へ戻します。判定は変更しません。"></p><footer><button id="undo" data-en="Cancel changes" data-ja="キャンセル（変更を破棄）"></button><button id="stop" data-en="Stop server" data-ja="サーバー停止" title="Stop this setup background process. The catalog and comparison servers are separate."></button></footer></main><dialog id="folder-picker"><h2 id="picker-title"></h2><div class="picker-nav"><select id="picker-roots" aria-label="Drive or home"></select><button id="picker-up" type="button" data-en="Parent folder" data-ja="上のフォルダー"></button></div><p id="picker-path"></p><div id="picker-list"></div><p id="picker-error" role="status"></p><div class="actions"><button id="picker-cancel" type="button" data-en="Cancel" data-ja="キャンセル"></button><button id="picker-use" type="button" data-en="Select this folder" data-ja="このフォルダーを選択"></button></div></dialog></body></html>
